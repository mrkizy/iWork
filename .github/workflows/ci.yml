# iWork CI：三平台矩阵（任务卡 T01 验收 1；方案 docs/plans/T01.md 2.6）。
# 工具链版本由仓库根的 rust-toolchain.toml 决定，rustup 在第一次调用 cargo 时自动安装。
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 与平台无关的检查只在 Linux 跑一次
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: domain 里不许出现厂商名与 git 字样
        run: scripts/check-domain-terms.sh
      # T03：iWork 进程不开 TCP/UDP 端口（源码层面；运行时监听检查归 T11）
      - name: 源码里没有 TCP/UDP
        run: scripts/check-no-tcp.sh
      - name: 源码检查自测（注入 TcpListener::bind 必须失败）
        run: scripts/check-no-tcp.sh --selftest
      # T03：dev feature（--dev-trust）没有被任何工作区 crate 默认打开
      - name: feature 图里没有 dev
        run: scripts/check-no-dev-trust.sh --graph-only

  test:
    # 只放 Rust 的编译、clippy、测试与真进程用例；发布构建检查拆到 release-check，前端拆到 frontend，三个 job 并行。
    # 实测（ubuntu）：cargo test 一步正常约 12 分钟（run 43210134953，测试执行合计 10 分钟），runner 慢时到过 25 分钟
    # （run 43207337002：同一批测试慢 2–8 倍，代码没变）；拆分前整个 job 正常约 30 分钟，慢时撞上 40 分钟上限。
    # 拆分后正常约 20 分钟，慢的那次按同样倍率约 33 分钟。上限不加：卡住时判超时并留下日志，不挂到默认的 6 小时
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows 上用 Git Bash 跑，与另外两个平台同一套脚本
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # iwork-client（Tauri 壳）在 Linux 上编译需要 WebKitGTK 等系统库，清单按 Tauri v2 官方 prerequisites。
      # 若这里装不上导致整个 workspace 编不过（方案 S7），把 iwork-client 拆成单独的 job：
      # 主 job 用 `--workspace --exclude iwork-client`，另起一个 job 跑 `cargo clippy -p iwork-client`。
      - name: Tauri 系统依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        if: runner.os != 'macOS'
        run: cargo test --workspace
      - name: cargo test（macOS：签名测试用 CI 建的共用钥匙串）
        if: runner.os == 'macOS'
        run: |
          # 共用的签名钥匙串：CI 的 macOS 上 codesign 只在用户搜索列表里的钥匙串找身份（探针 CI run 43302065465）。
          # 改搜索列表只在这里做：先存原列表（读不出或读出空列表就让这一步失败，不改），加进去，跑完不论成败恢复原列表、
          # 删钥匙串。仓库里的脚本与 Rust 测试一概不改搜索列表（审查 2/F-2）；证书由 test-signing-identity.sh 导入它。
          kc="$RUNNER_TEMP/iwork-test-signing.keychain-db"
          security create-keychain -p t "$kc"
          # 建好就装收尾：之后哪一步失败都删掉这个临时钥匙串；存好原列表之后才把「恢复原列表」加进收尾
          trap 'security delete-keychain "$kc"' EXIT
          security unlock-keychain -p t "$kc"
          security set-keychain-settings "$kc"
          saved=$(security list-keychains -d user)
          orig=()
          while IFS= read -r k; do k=${k#*\"}; k=${k%\"*}; [ -n "$k" ] && orig+=("$k"); done <<< "$saved"
          [ ${#orig[@]} -gt 0 ] || { echo "读出的钥匙串搜索列表是空的，不改" >&2; exit 1; }
          trap 'security list-keychains -d user -s "${orig[@]}"; security delete-keychain "$kc"' EXIT
          security list-keychains -d user -s "$kc" "${orig[@]}"
          export IWORK_TEST_SIGNING_KEYCHAIN="$kc"
          cargo test --workspace
      # T06 方案 4.3：hook timeout 调成 10 秒；S6-5b：会话任务 panic。故障注入只在测试 feature 下编译（见 scripts/check-no-dev-trust.sh）
      - name: 桥接故障注入
        if: runner.os != 'Windows'
        run: cargo test -p iwork-bridge-claude --features fake-cli,fault-injection --test fault_injection

      # T04：后台服务的真进程用例（真起 iwork-daemon：单实例、等锁接班、崩溃恢复、停机、投递、自行重启、自启、日志脱敏）
      #   与客户端拉起（卡验收 2）。要 dev feature：测试进程不是受信映像，后台要带 --dev-trust。
      #   launcher_process 用 target/debug/iwork-daemon，先单独构建 dev 版。
      - name: 后台服务真进程用例（macOS、Linux）
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          cargo test -p iwork-daemon --features dev --test process
          cargo build -p iwork-daemon --features dev
          cargo test -p iwork-client-core --features dev --test launcher_process
          # 桌面客户端的拨号器在 dev 构建里只用 DirectDialer（T04p 方案 4.7）
          cargo test -p iwork-client-core --features dev --test app_dialer
          # 客户端拒绝不可信的后台时 client.log 里有 peer_rejected（ADR-0013）
          cargo test -p iwork-client-core --features dev --test client_log_process

      # T04：M1 不支持 Windows，后台在启动表第 1 步就拒绝（退出码 10）。按名字核对这一条真的跑到且通过
      - name: 后台在 Windows 上启动即拒绝（Windows）
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          cargo test -p iwork-daemon --test windows_refuses 2>&1 | tee daemon-windows.log
          grep -q "^test unsupported_platform_refuses_at_identity \.\.\. ok" daemon-windows.log \
            || { echo "::error::没跑到或没通过：unsupported_platform_refuses_at_identity"; exit 1; }

      # T03：iwork-ipc 里 cfg(windows) 的测试（命名管道 DACL、两端 pid、按句柄验映像）要在 Windows 上真跑到。
      #   上面的 workspace 测试已经包含它们；这里按名字核对每一条都出现且通过，防止 cfg 写错后悄悄变成 0 条。
      #   独立于上一步：workspace 里别的 crate 测试失败时这里照样跑。
      - name: iwork-ipc 的 Windows 专属测试真的跑了（Windows）
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          cargo test -p iwork-ipc --lib -- windows 2>&1 | tee ipc-windows-tests.log
          for t in \
            transport::windows::tests::pipe_dacl_only_current_user \
            transport::windows::tests::second_listener_on_same_name_is_refused \
            transport::windows::tests::both_ends_see_this_process_and_bytes_flow \
            transport::windows::tests::non_pipe_endpoint_is_unsupported \
            peer::windows::tests::current_user_is_a_user_sid \
            peer::windows::tests::unsigned_own_image_is_hashed_through_the_bound_handle \
            peer::windows::tests::own_process_is_current_user_and_signer_passes_the_gate \
            peer::windows::tests::unopenable_pid_is_an_error_not_an_identity \
            peer::windows_image::tests::trust_code_values_match_windows_sys; do
            grep -q "^test $t \.\.\. ok" ipc-windows-tests.log || { echo "::error::没跑到或没通过：$t"; exit 1; }
          done

      - name: 依赖方向检查
        run: scripts/check-deps.sh
      - name: 依赖方向检查自测（注入违规必须失败）
        run: scripts/check-deps.sh --selftest

      # T03 验收 1：以另一个系统用户连接被拒（两个方向）。只在 Linux 上做得到。
      - name: 另一用户连接被拒（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo useradd -m iwork-other
          cargo build -p iwork-ipc --features dev --example ipc-tool
          # /home/runner 不让别的用户进，ipc-tool 要放到另一用户能执行的地方（run 42760925905：exec Permission denied）
          install -m 755 target/debug/examples/ipc-tool /tmp/iwork-ipc-tool
          IWORK_TEST_OTHER_USER=1 IWORK_IPC_TOOL=/tmp/iwork-ipc-tool \
            cargo test -p iwork-ipc --features dev --test peer_other_user -- --ignored
          # T06 方案 4.6 第 5 行：hook 通道上别的用户连进来，桥接直接关连接（测试自己把客户端拷进 /tmp 再以另一用户跑）
          IWORK_TEST_OTHER_USER=1 \
            cargo test -p iwork-bridge-claude --test hook_channel -- --ignored --exact other_user_rejected

  # 发布构建（T04p 方案 4.6）：macOS、Linux 上走打包命令 `pnpm -C client tauri build`，它编后台与客户端、装配、
  #   核对（恰好一种形态、两个程序互认），核对不过就是非零退出、不发布；CI 上它返回 0 就是核对过了。
  #   之后对成品里的两个程序跑 T03 验收 2 的检查（发布构建里没有 --dev-trust、没有 IWORK_DEV_）。
  #   macOS 打两种形态：A 无证书（带清单）；B 用现建的临时钥匙串里的自签证书（PD-2 定：进 CI），结束时删钥匙串。
  #   Windows：M1 不出包，仍只编客户端、查裸二进制。
  release-check:
    # 实测时长写进 T04p 的完成记录；接近上限就把形态 B 拆成单独的 job（方案第 7 节）
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # 编 iwork-client（Tauri 壳）在 Linux 上要 WebKitGTK 等系统库，清单同 test job
      - name: Tauri 系统依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - name: 发布构建没有 dev-trust（Windows：只编客户端）
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked -p iwork-client
          scripts/check-no-dev-trust.sh --artifacts target/release/iwork-client.exe
      # 打包命令要先编前端（tauri.build.conf.json 的 beforeBuildCommand 是 pnpm build，要 gen 出的 TS）
      - uses: pnpm/action-setup@v4
        if: runner.os != 'Windows'
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        if: runner.os != 'Windows'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: 前端依赖与生成代码
        if: runner.os != 'Windows'
        run: |
          pnpm -C client install --frozen-lockfile
          pnpm -C client gen
      - name: 发布包（Linux：带清单的目录）
        if: runner.os == 'Linux'
        run: |
          pnpm -C client tauri build
          scripts/check-no-dev-trust.sh --artifacts \
            target/release/dist/linux/iwork/iwork-client target/release/dist/linux/iwork/iwork-daemon
      - name: 发布包（macOS 形态 A：无证书，带清单）
        if: runner.os == 'macOS'
        run: |
          pnpm -C client tauri build
          bin=target/release/dist/unsigned/iWork.app/Contents/MacOS
          scripts/check-no-dev-trust.sh --artifacts "$bin/iwork-client" "$bin/iwork-daemon"
      - name: 发布包（macOS 形态 B：自签证书，整包签名）
        if: runner.os == 'macOS'
        run: |
          # 共用的签名钥匙串：CI 的 macOS 上 codesign 只在用户搜索列表里的钥匙串找身份（探针 CI run 43302065465）。
          # 改搜索列表只在这里做：先存原列表（读不出或读出空列表就让这一步失败，不改），加进去，跑完不论成败恢复原列表、
          # 删钥匙串。仓库里的脚本与 Rust 测试一概不改搜索列表（审查 2/F-2）；证书由 test-signing-identity.sh 导入它。
          kc="$RUNNER_TEMP/iwork-test-signing.keychain-db"
          security create-keychain -p t "$kc"
          # 建好就装收尾：之后哪一步失败都删掉这个临时钥匙串；存好原列表之后才把「恢复原列表」加进收尾
          trap 'security delete-keychain "$kc"' EXIT
          security unlock-keychain -p t "$kc"
          security set-keychain-settings "$kc"
          saved=$(security list-keychains -d user)
          orig=()
          while IFS= read -r k; do k=${k#*\"}; k=${k%\"*}; [ -n "$k" ] && orig+=("$k"); done <<< "$saved"
          [ ${#orig[@]} -gt 0 ] || { echo "读出的钥匙串搜索列表是空的，不改" >&2; exit 1; }
          trap 'security list-keychains -d user -s "${orig[@]}"; security delete-keychain "$kc"' EXIT
          security list-keychains -d user -s "$kc" "${orig[@]}"
          export IWORK_TEST_SIGNING_KEYCHAIN="$kc"
          sign="$RUNNER_TEMP/iwork-sign"
          mkdir -p "$sign"
          out=$(scripts/test-signing-identity.sh "$sign" "iWork CI Signer")
          identity=$(printf '%s\n' "$out" | sed -n 's/^identity=//p')
          IWORK_SIGN_IDENTITY="$identity" IWORK_SIGN_KEYCHAIN="$kc" pnpm -C client tauri build
          bin=target/release/dist/signed/iWork.app/Contents/MacOS
          scripts/check-no-dev-trust.sh --artifacts "$bin/iwork-client" "$bin/iwork-daemon"

  # 前端：类型检查与 vitest。从 test 拆出来单独跑，和 Rust 测试并行，各有各的时限。
  #   pnpm test 先 gen、再编译假后台录场景（fixtures）、再跑 vitest，所以这里要 rust-cache。
  frontend:
    # 最长一次（ubuntu，run 43156265818）前端测试 6.4 分钟，加上单独编译录像程序；留足余量
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          # 版本取 client/package.json 的 packageManager 字段
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: 前端依赖
        run: pnpm -C client install --frozen-lockfile
      - name: 前端类型检查（含 TS 生成）
        run: pnpm -C client typecheck
      # vitest 跑 client/src 与 client/tests 下全部测试：
      #   - 金样本跨语言解码（src/gen.test.ts）
      #   - 开发服务器只监听 127.0.0.1（tests/dev-server.test.ts，真起一次 vite 看监听地址）
      #   - 发布配置不含开发服务器、src-tauri/ 无未登记的 Tauri 配置、裸跑 tauri build/bundle 被拒
      #     （tests/release-config.test.ts，层清单与包装脚本共用 scripts/tauri-layers.ts）
      #   - 包装脚本只放行 dev/build、拒绝自带 -c/--config（tests/tauri-wrapper.test.ts）
      - name: 前端测试（金样本解码、开发服务器只绑回环、发布配置与包装脚本检查）
        run: pnpm -C client test

  # T03 方案 8.2 N2：Windows 上自签 Authenticode、WinVerifyTrust 返回码、改名后的进程映像路径、管道两端 pid。
  #   这是实测，不是检查：脚本只打印结论，不因结论失败；transcript 作为 artifact 留存，结论写进 t0-findings。
  #   自签证书由脚本在 CurrentUser\My 里现建、结束时删除，不用任何仓库密钥。
  windows-n2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: N2 实测
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/t0/iwork-t03-windows-authenticode.ps1
          $rc = $LASTEXITCODE
          Get-Content tools/t0/out/t03-windows/transcript.txt
          "## N2 实测（PowerShell 5.1）" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content tools/t0/out/t03-windows/transcript.txt >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          # 脚本本身出错（不是结论为「不成立」）才让这一步失败
          exit $rc
      - name: 上传 N2 记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t03-windows-n2
          path: tools/t0/out/t03-windows/transcript.txt
          if-no-files-found: error

  # T03 验收 3：cargo-fuzz 三个目标各跑 60 秒（nightly，只在 Linux）
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nightly 与 cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: fuzz
        working-directory: crates/iwork-ipc
        run: |
          for t in frame_decode connection_prehello connection_established; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done
