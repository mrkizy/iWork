# iWork CI：三平台矩阵（任务卡 T01 验收 1；方案 docs/plans/T01.md 2.6）。
# 工具链版本由仓库根的 rust-toolchain.toml 决定，rustup 在第一次调用 cargo 时自动安装。
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 与平台无关的检查只在 Linux 跑一次
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: domain 里不许出现厂商名与 git 字样
        run: scripts/check-domain-terms.sh
      # T03：iWork 进程不开 TCP/UDP 端口（源码层面；运行时监听检查归 T11）
      - name: 源码里没有 TCP/UDP
        run: scripts/check-no-tcp.sh
      - name: 源码检查自测（注入 TcpListener::bind 必须失败）
        run: scripts/check-no-tcp.sh --selftest
      # T03：dev feature（--dev-trust）没有被任何工作区 crate 默认打开
      - name: feature 图里没有 dev
        run: scripts/check-no-dev-trust.sh --graph-only

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows 上用 Git Bash 跑，与另外两个平台同一套脚本
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # iwork-client（Tauri 壳）在 Linux 上编译需要 WebKitGTK 等系统库，清单按 Tauri v2 官方 prerequisites。
      # 若这里装不上导致整个 workspace 编不过（方案 S7），把 iwork-client 拆成单独的 job：
      # 主 job 用 `--workspace --exclude iwork-client`，另起一个 job 跑 `cargo clippy -p iwork-client`。
      - name: Tauri 系统依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

      # T03：iwork-ipc 里 cfg(windows) 的测试（命名管道 DACL、两端 pid、按句柄验映像）要在 Windows 上真跑到。
      #   上面的 workspace 测试已经包含它们；这里按名字核对每一条都出现且通过，防止 cfg 写错后悄悄变成 0 条。
      - name: iwork-ipc 的 Windows 专属测试真的跑了（Windows）
        if: runner.os == 'Windows'
        run: |
          cargo test -p iwork-ipc --lib -- windows 2>&1 | tee ipc-windows-tests.log
          for t in \
            transport::windows::tests::pipe_dacl_only_current_user \
            transport::windows::tests::second_listener_on_same_name_is_refused \
            transport::windows::tests::both_ends_see_this_process_and_bytes_flow \
            transport::windows::tests::non_pipe_endpoint_is_unsupported \
            peer::windows::tests::current_user_is_a_user_sid \
            peer::windows::tests::unsigned_own_image_is_hashed_through_the_bound_handle \
            peer::windows::tests::own_process_is_current_user_and_signer_passes_the_gate \
            peer::windows::tests::unopenable_pid_is_an_error_not_an_identity \
            peer::windows_image::tests::trust_code_values_match_windows_sys; do
            grep -q "^test $t \.\.\. ok" ipc-windows-tests.log || { echo "::error::没跑到或没通过：$t"; exit 1; }
          done

      - name: 依赖方向检查
        run: scripts/check-deps.sh
      - name: 依赖方向检查自测（注入违规必须失败）
        run: scripts/check-deps.sh --selftest

      # T03 验收 2：发布构建里没有 --dev-trust（feature 图、产物字符串含阳性对照、发布进程拒绝该参数）
      #   打包步骤（tauri build）还没进 CI，先对 release 的客户端二进制做同样的 grep；打包进 CI 后把产物路径加到 --artifacts
      - name: 发布构建没有 dev-trust
        run: |
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          cargo build --release --locked -p iwork-client
          scripts/check-no-dev-trust.sh --artifacts "target/release/iwork-client${exe}"

      # T03 验收 1：以另一个系统用户连接被拒（两个方向）。只在 Linux 上做得到。
      - name: 另一用户连接被拒（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo useradd -m iwork-other
          cargo build -p iwork-ipc --features dev --example ipc-tool
          IWORK_TEST_OTHER_USER=1 IWORK_IPC_TOOL="$PWD/target/debug/examples/ipc-tool" \
            cargo test -p iwork-ipc --features dev --test peer_other_user -- --ignored

      - uses: pnpm/action-setup@v4
        with:
          # 版本取 client/package.json 的 packageManager 字段
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: 前端依赖
        run: pnpm -C client install --frozen-lockfile
      - name: 前端类型检查（含 TS 生成）
        run: pnpm -C client typecheck
      # vitest 跑 client/src 与 client/tests 下全部测试：
      #   - 金样本跨语言解码（src/gen.test.ts）
      #   - 开发服务器只监听 127.0.0.1（tests/dev-server.test.ts，真起一次 vite 看监听地址）
      #   - 发布配置不含开发服务器、src-tauri/ 无未登记的 Tauri 配置、裸跑 tauri build/bundle 被拒
      #     （tests/release-config.test.ts，层清单与包装脚本共用 scripts/tauri-layers.ts）
      #   - 包装脚本只放行 dev/build、拒绝自带 -c/--config（tests/tauri-wrapper.test.ts）
      - name: 前端测试（金样本解码、开发服务器只绑回环、发布配置与包装脚本检查）
        run: pnpm -C client test

  # T03 方案 8.2 N2：Windows 上自签 Authenticode、WinVerifyTrust 返回码、改名后的进程映像路径、管道两端 pid。
  #   这是实测，不是检查：脚本只打印结论，不因结论失败；transcript 作为 artifact 留存，结论写进 t0-findings。
  #   自签证书由脚本在 CurrentUser\My 里现建、结束时删除，不用任何仓库密钥。
  windows-n2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: N2 实测
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/t0/iwork-t03-windows-authenticode.ps1
          $rc = $LASTEXITCODE
          Get-Content tools/t0/out/t03-windows/transcript.txt
          "## N2 实测（PowerShell 5.1）" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content tools/t0/out/t03-windows/transcript.txt >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          # 脚本本身出错（不是结论为「不成立」）才让这一步失败
          exit $rc
      - name: 上传 N2 记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t03-windows-n2
          path: tools/t0/out/t03-windows/transcript.txt
          if-no-files-found: error

  # T03 验收 3：cargo-fuzz 三个目标各跑 60 秒（nightly，只在 Linux）
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nightly 与 cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: fuzz
        working-directory: crates/iwork-ipc
        run: |
          for t in frame_decode connection_prehello connection_established; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done
