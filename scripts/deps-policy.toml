# crate 依赖方向的唯一真值，由 scripts/check-deps.sh 读取（规则说明见 docs/adr/0005）。
#
# 只用 TOML 的一个小子集（脚本用 jq 解析）：`[workspace]`、`[crates.<名字>]` 两种表头，
# 值只有 "字符串" 或 ["字符串", ...]（可跨行）；注释用 #。写出子集以外的东西脚本会报错退出 2。
#
# 每个工作区 crate 必须有一节，多一节少一节都报错。各键：
#   internal          必填。normal + build 依赖的传递闭包里允许出现的全部工作区 crate
#   direct            可选。直接依赖（normal + build）里允许的外部 crate；不写 = 不限
#   direct_dev        可选。直接 dev 依赖里允许的外部 crate；不写 = 不限
#   deny_transitive   可选。传递禁用查到哪一层：
#                       "normal_build"（默认）只查会链接进产物的闭包；
#                       "normal_build_dev" 连本 crate 的 dev 依赖闭包一起查（测试也必须是纯的）；
#                       "none" 不查（只有组合入口 daemon 用）
#   transitive_exempt 可选。本 crate 本来就该有的框架；它们本身和它们带进来的依赖都不算违规

[workspace]
# 传递禁用：I/O 与框架类 crate，出现在闭包里就违规
io_and_framework = [
    "tokio", "async-std", "smol", "mio",
    "rusqlite", "sqlx", "gix", "git2",
    "agent-client-protocol", "tauri",
    "hyper", "reqwest", "keyring", "notify-rust",
]

[crates.iwork-proto]
internal = []
direct = ["prost", "prost-types", "bytes", "prost-build", "protox"]

[crates.iwork-domain]
internal = []
direct = ["ulid", "thiserror"]
direct_dev = ["proptest"]
deny_transitive = "normal_build_dev"

[crates.iwork-ports]
internal = ["iwork-domain"]
direct = ["thiserror"]
direct_dev = ["pollster"]
deny_transitive = "normal_build_dev"

[crates.iwork-shell]
# Bash 语法解析，把 brush-parser 隔离在这一个 crate 里（T07 方案 3.3、ADR-T07-a）
# serde：只用来写一个收字符串的 Serializer，走完整 AST 找命令替换（方案 3.3），纯计算
internal = []
direct = ["brush-parser", "serde"]
direct_dev = ["proptest"]
deny_transitive = "normal_build_dev"

[crates.iwork-core]
internal = ["iwork-domain", "iwork-ports", "iwork-shell"]
# futures-channel / futures-core：无运行时的信箱与 Stream trait，回合编排同时等多路输入用（ADR-0006）
# sha2：亲手执行提议哈希与调用摘要（T07 方案 5.4、6.2），纯计算
# serde_json：解析运行时给的工具输入 JSON（T07 方案 3.1），纯计算
direct = ["thiserror", "futures-channel", "futures-core", "sha2", "serde_json"]

[crates.iwork-app]
internal = ["iwork-core", "iwork-shell", "iwork-ports", "iwork-proto", "iwork-domain"]

[crates.iwork-store]
internal = ["iwork-ports", "iwork-domain"]
direct = ["rusqlite", "sha2", "thiserror", "tracing"]
direct_dev = ["pollster", "proptest", "prost", "prost-reflect", "rusqlite", "tempfile", "tracing-subscriber"]
transitive_exempt = ["rusqlite"]

[crates.iwork-agent-acp]
internal = ["iwork-ports", "iwork-domain", "iwork-proto"]
transitive_exempt = ["agent-client-protocol", "tokio"]

[crates.iwork-rootfs]
# 只用 std：在项目根内不跟随符号链接地读写文件（ADR-0010）
internal = []
direct = []
deny_transitive = "normal_build_dev"

[crates.iwork-vcs-git]
internal = ["iwork-ports", "iwork-domain", "iwork-rootfs"]
transitive_exempt = ["gix", "tokio"]

[crates.iwork-host]
internal = ["iwork-ports", "iwork-domain", "iwork-rootfs"]
transitive_exempt = ["keyring", "tokio"]

[crates.iwork-ipc]
internal = ["iwork-proto"]
transitive_exempt = ["tokio"]

[crates.iwork-daemon]
internal = [
    "iwork-domain", "iwork-ports", "iwork-proto", "iwork-core", "iwork-shell", "iwork-app",
    "iwork-store", "iwork-agent-acp", "iwork-vcs-git", "iwork-host", "iwork-ipc",
    "iwork-rootfs",
]
deny_transitive = "none"

[crates.iwork-bridge-claude]
internal = ["iwork-proto", "iwork-claude-hook"]
transitive_exempt = ["agent-client-protocol", "tokio"]

[crates.iwork-claude-hook]
internal = []
direct = ["serde", "serde_json"]

[crates.iwork-client-core]
internal = ["iwork-ipc", "iwork-proto"]
transitive_exempt = ["tokio"]

[crates.iwork-client]
internal = ["iwork-client-core", "iwork-ipc", "iwork-proto"]
transitive_exempt = ["tokio", "tauri"]

[crates.iwork-fake-agent]
internal = ["iwork-proto"]
transitive_exempt = ["agent-client-protocol", "tokio"]

[crates.iwork-bench]
# T03：ipc 热路径基准（推送扇出、补发、快照、握手）。T11 收编其余基准时再按需加。
internal = ["iwork-ipc", "iwork-proto"]
transitive_exempt = ["tokio"]
