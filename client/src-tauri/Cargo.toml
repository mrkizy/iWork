[package]
name = "iwork-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
iwork-client-core.workspace = true
iwork-ipc.workspace = true
iwork-proto.workspace = true
prost.workspace = true
tauri.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Dock 角标与跳动、退出菜单的 Option 替换项（T09 方案 2.8、Q16）
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync"] }

[features]
# 只转发到 iwork-client-core/dev → iwork-ipc/dev（DevTrust）；不是默认 feature。见 scripts/check-no-dev-trust.sh。
dev = ["iwork-client-core/dev", "iwork-ipc/dev"]
# 真实 WebView 测试的构建（client/tests/e2e）：初始化脚本、结果经页面标题回报、可换 CSP。隐含 dev；
# 不是默认 feature，发布构建没有它（scripts/check-no-dev-trust.sh 的 feature 图检查同样覆盖）。
e2e = ["dev"]
