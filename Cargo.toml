[workspace]
resolver = "3"
members = ["crates/*", "client/src-tauri"]
# cargo-fuzz 目标是独立 workspace（nightly 构建），不进 cargo test --workspace 与依赖方向检查。
exclude = ["crates/iwork-ipc/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 与 rust-toolchain.toml 的版本保持一致：resolver 3 只挑这个版本能编的依赖，
# 写得比工具链低会把依赖锁在有安全公告的旧版本上（time、plist 曾因此卡住）。
rust-version = "1.99"
license = "UNLICENSED"
publish = false

# 外部依赖版本只在这里写一次；各 crate 用 `xxx.workspace = true` 引用。
# 哪个 crate 能用哪个依赖由 scripts/deps-policy.toml 约束，不在这里。
[workspace.dependencies]
bytes = "1.12"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
prost-reflect = { version = "0.16", features = ["text-format", "serde"] }
protox = "0.10"
serde_json = "1"
thiserror = "2"
ulid = { version = "3", default-features = false }
# 本机时区（锚点的时间文字：今天显示时刻，更早显示日期）；已经经 gix-date 在依赖图里，同一版本
jiff = "0.2.41"
proptest = "1"
pollster = "1"
tauri = "2.12"
# 客户端 macOS 上的 Dock 角标与跳动、退出菜单的 Option 替换项（T09 步 5a）：没有窗口时只能经 NSApp 做。
# 与 tauri 带进来的同一版本，只开用到的几个类。
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder", "NSMenu", "NSMenuItem"] }
# 系统文件选择框（回形针、「重新定位」；T09 组 2b）。关默认 feature：Linux 走 gtk3、Windows 走 common-controls-v6
# （产品负责人 2026-11-11 定）。
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3", "common-controls-v6"] }
agent-client-protocol = "5.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-channel = "0.3"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp"] }
base64 = "0.22"
getrandom = "0.3"
# Bash 语法解析，只许 iwork-shell 用（T07 方案 3.3、ADR-T07-a）
brush-parser = "0.4"
tauri-build = "2.7"
tokio-util = { version = "0.7", features = ["codec"] }
# 读 git 仓库（gitoxide）。只开 status（含 dirwalk、index、blob-diff），不要默认的网络与 CLI 便利功能
gix = { version = "0.90", default-features = false, features = ["status", "sha1"] }
# Windows 上 canonicalize 去掉 `\\?\` 前缀；其他平台等同 std::fs::canonicalize
dunce = "1"
# 读 `.iwork/project.toml`；只要解析，不要写出与 serde 派生
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
# 按字素簇截字：对话自动标题（技术设计 9.0a）、锚点摘录（T09 方案 2.9）
unicode-segmentation = "1"
sha2 = "0.10"
hex = "0.4"
core-foundation-sys = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

iwork-proto = { path = "crates/iwork-proto" }
iwork-domain = { path = "crates/iwork-domain" }
iwork-ports = { path = "crates/iwork-ports" }
iwork-core = { path = "crates/iwork-core" }
iwork-shell = { path = "crates/iwork-shell" }
iwork-app = { path = "crates/iwork-app" }
iwork-store = { path = "crates/iwork-store" }
iwork-agent-acp = { path = "crates/iwork-agent-acp" }
iwork-vcs-git = { path = "crates/iwork-vcs-git" }
iwork-rootfs = { path = "crates/iwork-rootfs" }
iwork-host = { path = "crates/iwork-host" }
iwork-ipc = { path = "crates/iwork-ipc" }
iwork-claude-hook = { path = "crates/iwork-claude-hook" }
iwork-client-core = { path = "crates/iwork-client-core" }
iwork-fake-daemon = { path = "crates/iwork-fake-daemon" }

# hook 每次工具调用都冷启动一次，体积与启动时间进基准（T06 方案 2.3、第 14 节）
[profile.release.package.iwork-claude-hook]
opt-level = "s"

# 调试构建也优化 sha2：Linux 上运行映像与对端身份都是对整个可执行文件算 SHA-256，调试构建的后台约 150 MB，
# 不优化时算一次约 7s（优化后约 0.5s），并行的真进程测试会一起超时（T04 组 3，CI 实测）。
[profile.dev.package.sha2]
opt-level = 3
