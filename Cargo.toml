[workspace]
resolver = "3"
members = ["crates/*", "client/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 与 rust-toolchain.toml 的版本保持一致：resolver 3 只挑这个版本能编的依赖，
# 写得比工具链低会把依赖锁在有安全公告的旧版本上（time、plist 曾因此卡住）。
rust-version = "1.99"
license = "UNLICENSED"
publish = false

# 外部依赖版本只在这里写一次；各 crate 用 `xxx.workspace = true` 引用。
# 哪个 crate 能用哪个依赖由 scripts/deps-policy.toml 约束，不在这里。
[workspace.dependencies]
bytes = "1.12"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
prost-reflect = { version = "0.16", features = ["text-format", "serde"] }
protox = "0.10"
serde_json = "1"
thiserror = "2"
ulid = { version = "3", default-features = false }
proptest = "1"
pollster = "1"
tauri = "2.12"
agent-client-protocol = "5.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-channel = "0.3"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp"] }
base64 = "0.22"
tauri-build = "2.7"
# 读 git 仓库（gitoxide）。只开 status（含 dirwalk、index、blob-diff），不要默认的网络与 CLI 便利功能
gix = { version = "0.90", default-features = false, features = ["status", "sha1"] }
# Windows 上 canonicalize 去掉 `\\?\` 前缀；其他平台等同 std::fs::canonicalize
dunce = "1"
# 读 `.iwork/project.toml`；只要解析，不要写出与 serde 派生
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

iwork-proto = { path = "crates/iwork-proto" }
iwork-domain = { path = "crates/iwork-domain" }
iwork-ports = { path = "crates/iwork-ports" }
iwork-core = { path = "crates/iwork-core" }
iwork-app = { path = "crates/iwork-app" }
iwork-store = { path = "crates/iwork-store" }
iwork-agent-acp = { path = "crates/iwork-agent-acp" }
iwork-vcs-git = { path = "crates/iwork-vcs-git" }
iwork-rootfs = { path = "crates/iwork-rootfs" }
iwork-host = { path = "crates/iwork-host" }
iwork-ipc = { path = "crates/iwork-ipc" }
iwork-claude-hook = { path = "crates/iwork-claude-hook" }
iwork-client-core = { path = "crates/iwork-client-core" }
