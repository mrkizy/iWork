// 随会话下发给桥接（iwork-bridge-claude、iwork-fake-agent）的类型（设计 2、7.0、7.2b）。
// 桥接只依赖本文件与 common.proto（外加标准的 Timestamp）：不需要知道命令与视图，客户端协议改动不会让桥接重编。
// 这里只放抽象约束；翻译成厂商设置项是适配器的事，核心不写厂商特例。
//
// 兼容规则：字段只增不改号；删字段先 `reserved` 编号与名字（同一主版本内只标 deprecated 不删）；
// 枚举值同理；不改 oneof 字段的类型。全文见 proto/compat/README.md，由 tests/compat.rs 检查。
syntax = "proto3";

package iwork.v1;

import "google/protobuf/timestamp.proto";
import "iwork/v1/common.proto";

// 沙箱抽象约束（设计 7.0 表）。系统底线三档相同；只写白名单只在手动、自动档生效，全开档放开为 anywhere。
message SessionConstraints {
  // 禁读禁写：凭据目录、iWork 数据目录。
  repeated string deny_read_write = 1;
  // 只读区：数据目录下的 attachments/、imports/。
  repeated string read_only = 2;
  AllowWrite allow_write = 3;
  // 需凭据命令清单：在沙箱外运行。
  repeated CommandPattern excluded_commands = 4;
  // 清单外命令被挡后可请求沙箱外重试（手动、自动档为 true，全开档为 false）。
  bool allow_unsandboxed_retry = 5;
  NetworkPolicy network = 6;
}

message AllowWrite {
  oneof kind {
    WritablePaths whitelist = 1;
    // 全开档：可写任何位置，底线目录仍禁读禁写（deny_read_write 更具体，优先生效）。
    AnywhereWritable anywhere = 2;
  }
}

message WritablePaths {
  repeated string paths = 1;
}

message AnywhereWritable {}

// 程序名 + 可选子命令，匹配规则同设计 7.1。
message CommandPattern {
  string program = 1;
  optional string subcommand = 2;
}

// 联网不受控（需求 v1.38），目前只有 OPEN；以后要收紧只能加值。
enum NetworkPolicy {
  NETWORK_POLICY_UNSPECIFIED = 0;
  NETWORK_POLICY_OPEN = 1;
}

// 本次会话可用的工具（设计 7.2b）。7.1 永久禁用的工具（云端定时、会话内定时等）任何会话都不提供，不在这里表达。
message SessionToolSet {
  repeated ToolGroup enabled_groups = 1;
  // 是否提供不属于四个分组、自身无副作用的工具（子代理、TodoWrite 等）。AI 审查回合为 false。
  bool include_always_on = 2;
}

// 本次会话显式传入的模型：配置隔离后不传就是 CLI 内置默认，不允许这种状态（设计 9.6 第 6 条）。
message SessionModel {
  ModelSelection model = 1;
}

// 开会话时随 ACP `session/new`、`session/load` 的 `_meta` 下发给桥接的会话配置（设计 6.1、6.3）。
// 系统提示走 ACP 标准字段 `systemPrompt`，不在这里。编码：本消息的 Protobuf 二进制再做标准 base64，
// 放在 `_meta["iwork"]["sessionSetup"]`；桥接解不出来时必须拒绝开会话，不能退回 CLI 默认值。
message SessionSetup {
  ModelSelection model = 1;
  SessionConstraints constraints = 2;
  SessionToolSet tool_set = 3;
  // 启动时不提供的工具名：核心按会话工具集与永久禁用表算好（设计 7.1、7.2b），适配器原样交给运行时。
  repeated string disabled_tools = 4;
  // 按会话加载的插件目录（导入区下的绝对路径，设计 9.5）。
  repeated string plugin_dirs = 5;
  // 内置工具白名单（T06 方案第 9 节，P11 的 d，2026-11-12）：只在 CLI 版本不在已验证表里时由适配器填。
  // 没有这个字段 = 不限制；有而 tools 为空是无效配置，桥接必须拒绝开会话（不能当成「一个工具都不给」）。
  BuiltinToolAllowlist builtin_tool_allowlist = 6;
}

// 包一层消息，好分清「没给」和「给了空的」（裸的 repeated 分不清）。
message BuiltinToolAllowlist {
  repeated string tools = 1;
}

// 运行时向后台上报的事实。编码同 SessionSetup（Protobuf 二进制再做标准 base64），挂在一条
// `session/update` 通知的 `_meta["iwork"]["report"]` 上（T06 方案 2.5）。只在回合进行中上报：
// 回合之外到达的更新后台一律丢弃。
message RuntimeReport {
  oneof kind {
    // 运行时实际使用的模型；每个回合报一次。
    ModelSelection model = 1;
    // 一个回合的用量。
    Usage usage = 2;
    QuotaReport quota = 3;
  }
}

message QuotaReport {
  repeated QuotaWindowReport windows = 1;
}

// 一个额度窗口。观测时间由后台记，这里不带（model.proto 的 QuotaWindow 带观测时间，本文件不引用它）。
message QuotaWindowReport {
  // 窗口类型，运行时给的不透明字符串。
  string window = 1;
  // 使用率百分比，0–100。
  uint32 used_pct = 2;
  google.protobuf.Timestamp resets_at = 3;
}
