// ViewPatch：客户端 Rust 侧每 16ms 最多算一帧、由网页层经 invoke 长等待取走的视图增量（设计 3.6；T09 方案 2.4）。
// 网页层只解这一个文件的类型，不接触协议全集、不做业务判断：「可否点击」「计数」「表情状态」「文案」都由
// Rust 侧（iwork-client-core 的 derive）算好放进来。
//
// 兼容规则：字段只增不改号；删字段先 `reserved` 编号与名字；枚举值同理；不改 oneof 字段的类型。
// 本文件不落盘、只在客户端进程内传，所以不进 proto/compat/ 契约比对（S8）；但照样只加 optional 字段与新变体，
// 老字段标 deprecated，不改结构。
//
// 不 import model.proto：网页层不认识协议实体。需要回传给 Rust 的取值（如记住范围）用 Rust 侧给的不透明整数。
syntax = "proto3";

package iwork.v1;

message ViewPatch {
  // 帧序号，单调递增。
  uint64 frame = 1;
  repeated ViewChange changes = 2;
}

message ViewChange {
  oneof change {
    // 项目列表、助手列表、待处理计数、额度一行。
    SidebarPatch sidebar = 10;
    // 某个对话的可见窗口。
    ConversationPatch conversation = 11;
    // 「待你处理」页。
    PendingPatch pending = 12;
    // 设置页（含记住的规则、运行时、导入摘要）。
    SettingsPatch settings = 13;
    // 助手主页与配置页。
    AssistantProfilePatch assistant = 14;
    // 添加项目流程（克隆进度、草稿卡片）。
    AddProjectPatch add_project = 15;
    // 连接状态、「正在切换版本」、诊断信息。
    ConnectionPatch connection = 16;
    // 「全部对话」列表页（T09 方案 2.7）。
    ConversationListPatch conversation_list = 17;
    // 请网页跳到某个对话（点击系统通知后）。
    NavigatePatch navigate = 18;
    // 首页（还没有对话时的输入框）。
    HomePatch home = 19;
  }
}

// 跳转请求：seq 单调递增，网页按 seq 去重，只跳一次。
message NavigatePatch {
  uint64 seq = 1;
  string conversation_id = 2;
  // 跳到对话里的这一行；空表示停在最新。
  string row_key = 3;
  // 这次跳转是首页「新建对话并发出首条消息」的收尾：网页清掉这个项目首页的草稿。
  optional string started_project_id = 4;
  // 打开「待你处理」页（被系统通知叫到前台、那一项没有对话归属时；T09 方案 2.8）。此时 conversation_id 为空。
  bool pending_list = 5;
  // 打开这个项目的首页（添加、新建项目之后；T09 方案 15.2）。此时 conversation_id 为空。
  optional string project_id = 6;
  // 请网页打开添加项目弹窗（拖入一个文件夹时）。
  bool add_project = 7;
}

// ---------- 通用小件 ----------

// 助手头像（ui-m1.md 3.3）。画什么全由 Rust 定（client-core derive::avatar）；形象与表情给字符串 id，
// 对应 design-system/characters/<形象>-<表情>.svg，网页按 id 查构建时生成的素材清单。加素材不改协议。
message AvatarView {
  // 原来的字母头像首字：M1 不再画字母头像（F-10）。
  reserved 1;
  reserved "initial";
  // 形象主色：设计令牌名（ch1、ch4 等，ui-m1 2a 第 18 条 a），网页解析成 var(--<名>) 经 --ch4 交给素材；
  // 配置里不认识的值 Rust 已换成默认 ch4。空表示用素材自带的颜色（换过形象的）。
  string color = 2;
  // 形象 id。
  string character = 3;
  // 表情 id，随状态变化，与「轻松元素」开关无关。
  string mood = 4;
  // 配合的动效：motion.css 里的类名去掉 `iw-` 前缀（如 float）；空表示没有。
  string motion = 5;
  // 内置 iWork：画应用标志，不画形象。
  bool app_logo = 6;
}

// 侧栏对话圆点（ui-m1.md 2a 第 1 条）：等你处理 > 出错 > 运行中 > 空闲。
enum DotState {
  DOT_STATE_UNSPECIFIED = 0;
  DOT_STATE_IDLE = 1;
  DOT_STATE_RUNNING = 2;
  DOT_STATE_ERROR = 3;
  DOT_STATE_WAITING = 4;
}

// 一个由 Rust 侧给的选项：value 原样回传，label 原样显示。
message OptionView {
  int32 value = 1;
  string label = 2;
  // 选项下面的一句说明（如档位菜单里每一档的说明）；没有为空。
  string description = 3;
  // 选项旁的小标签（如全开的「仅本对话」）；没有为空。
  string tag = 4;
}

// ---------- 侧栏 ----------

message SidebarPatch {
  // 脏了就整份发（T09 方案 2.4）。
  optional SidebarView view = 1;
}

message SidebarView {
  // 原来的「待你处理」计数：换成了 pending_badge（文字由 Rust 给，超过 99 写「99+」）。
  reserved 1;
  reserved "pending_count";
  repeated ProjectRow projects = 2;
  repeated AssistantRow assistants = 3;
  repeated QuotaCell quota = 4;
  // 「待你处理」计数（不含已作废）；0 时不设。
  CountBadge pending_badge = 5;
  // 对话标题最多几个字符（按码点算）：就地重命名时截到这么长，Rust 提交时再校验一次。
  uint32 title_max_chars = 6;
  // 新建助手弹窗的运行时 / 模型 / 思考强度（默认选中内置 iWork 的）。
  ModelMenuView new_assistant_menu = 7;
  // 新建助手的命令在途：「创建」不可点（Rust 同时拒第二次，审查 g3 1/F-4）。
  bool creating_assistant = 8;
}

// 数字徽标（ui-m1.md 第 2 节第 4 条）：超过 99 写「99+」，侧栏徽标、「待你处理」与 Dock 角标同一个规则。
// 计数为 0 时整个不设，界面不画。
message CountBadge {
  string text = 1;
  // 读屏读的整句（带真实数目），如「120 条未读」。
  string label = 2;
}

message ProjectRow {
  string project_id = 1;
  string name = 2;
  // 原来的未读数：换成了 unread_badge。
  reserved 3;
  reserved "unread";
  bool pinned = 4;
  // 找不到路径：划线、标签、行内「重新定位」。
  bool path_missing = 5;
  string path_missing_label = 6;
  // 最近 5 个对话（Rust 侧按最近活动取好）。
  repeated ConversationItem recent = 7;
  // 有没有更多对话（显示「全部对话」）。
  bool has_more_conversations = 8;
  string root_path = 9;
  CountBadge unread_badge = 10;
}

message ConversationItem {
  string conversation_id = 1;
  string title = 2;
  DotState dot = 3;
  // 悬停时的状态名。
  string dot_label = 4;
  bool can_rename = 5;
  bool can_delete = 6;
  // 原来的未读数：换成了 unread_badge。
  reserved 7;
  reserved "unread";
  // 当前打开的对话。
  bool selected = 8;
  // 「全部对话」页用：最近一条消息首行与最近活动时间（已格式化）。
  string last_message_first_line = 9;
  string last_active_label = 10;
  CountBadge unread_badge = 11;
}

message AssistantRow {
  string assistant_id = 1;
  string name = 2;
  AvatarView avatar = 3;
  // 原来的表情枚举，并进了 AvatarView.mood。
  reserved 4;
  reserved "expression";
  // 最近动态一行；从没说过话时不设，界面不显示第二行。
  optional string activity_line = 5;
  // 原来的未读数：换成了 unread_badge。
  reserved 6;
  reserved "unread";
  bool can_delete = 7;
  string dm_conversation_id = 8;
  bool builtin = 9;
  bool selected = 10;
  // 只算它那条私聊。
  CountBadge unread_badge = 11;
}

// 额度一行里的一格：取不到时 value_text 是「—」。
message QuotaCell {
  string runtime_label = 1;
  string value_text = 2;
  // 悬停：窗口类型与重置时间。
  string tooltip = 3;
  // 细进度条的用量（0–100）；取不到时不设，界面不画条。
  optional uint32 used_pct = 4;
}

// ---------- 对话 ----------

message ConversationPatch {
  string conversation_id = 1;
  // 标题、项目选择器、运行时·模型、档位按钮状态、本对话用量。
  ConversationHeader header = 2;
  // 已废弃：行改用 rows（T09 方案 2.4）。
  repeated MessageView upserts = 3 [deprecated = true];
  // 流式追加。同一帧里这一行也整行重发时只发整行。
  repeated MessageTextAppend appends = 4;
  // 网页应删掉的行（RowView.key）。
  repeated string removed_ids = 5;
  // 可见范围与总数，供虚拟滚动。
  WindowInfo window = 6;
  // 整行替换或新增，按 key 认行。
  repeated RowView rows = 7;
  // 为真时网页先清空这个对话的全部行再应用本 patch（换代、时间线重建、切换对话）。
  bool reset = 8;
  ComposerView composer = 9;
  // 时间线不可用时的整页说明（如「数据不完整，无法显示这个对话」）；设了就不显示行。
  optional string blocking_notice = 10;
  // 消息锚点（T09 方案 2.9）：列表变了才整份发；还没取到时不设，组件不显示。
  optional AnchorsView anchors = 11;
  // 当前位置：变了才发。
  optional AnchorCursor anchor_cursor = 12;
  // 一次性的滚动指令（跳到锚点）：网页只对没见过的 token 滚动并高亮。
  optional ScrollTo scroll_to = 13;
}

// 消息锚点：后台按窗口给的一段（以当前位置为中心前后各取若干条），文字都在 Rust 侧拼好。
message AnchorsView {
  repeated AnchorItem items = 1;
  // 窗口前后还有没有（到头时滚轮回弹）。
  bool has_before = 2;
  bool has_after = 3;
  // 静止态的两个状态点：整个对话里还有等你处理的事 / 有失败的回合。
  bool has_waiting = 4;
  bool has_failed = 5;
  // 跳到还没加载的地方、正在取那一段时给读屏的话（「正在定位到所选消息」，网页放进隐藏的 role="status"，
  // 不显示文字）；不在加载时不设。
  optional string jump_loading = 6;
  // 正在跳的那一处（AnchorItem.key）：那条刻度做「流光」，对话区顶端出进度线（ui-m1 2a 第 11 条）。不在加载时为空。
  string jump_loading_key = 7;
}

enum AnchorKind {
  ANCHOR_KIND_UNSPECIFIED = 0;
  ANCHOR_KIND_USER = 1;
  ANCHOR_KIND_WAITING = 2;
  ANCHOR_KIND_FAILED = 3;
}

message AnchorItem {
  // 锚点的身份，原样回传（JumpToAnchor、AnchorBrowse）。
  string key = 1;
  AnchorKind kind = 2;
  // 你 / 等你处理 / 失败。
  string kind_label = 3;
  // 今天显示时刻，更早显示日期（本机时区）。
  string time_label = 4;
  // 信息卡的预览文字；网页只限制成两行。
  string preview = 5;
}

message AnchorCursor {
  // 当前位置是哪一处（AnchorItem.key）；没有锚点时为空。
  string current_key = 1;
}

message ScrollTo {
  // 滚到哪一行（RowView.key）。
  string row_key = 1;
  // 高亮多久，网页计时。
  uint32 highlight_ms = 2;
  // 每次跳转加一；同一个 token 只滚一次。
  uint64 token = 3;
}

message ConversationHeader {
  string title = 1;
  bool can_rename = 2;
  // 「本对话用量」：token 合计与悬停明细。
  string usage_text = 3;
  string usage_tooltip = 4;
  // 私聊的项目选择器：当前值的文字与选项；项目对话不设。
  optional string project_selector_label = 5;
  repeated ProjectOption project_options = 6;
  // 「已回到最新消息」等提示条。
  optional string notice = 7;
  bool is_dm = 8;
  string project_id = 9;
  // 正在往窗口里拖文件：整块对话区的虚线框文字（「松开以添加」）；没在拖时不设。
  optional string drop_hint = 10;
}

message ProjectOption {
  // 空表示「私聊」。
  string project_id = 1;
  string label = 2;
  bool selected = 3;
}

// 输入框一带：发送 / 停止、运行时·模型、档位。
message ComposerView {
  bool can_send = 1;
  // 发不了时输入框上方的一行说明；警示色由 tone 决定。
  optional string block_reason = 2;
  Tone block_tone = 3;
  // 验证中：转圈。
  bool busy = 4;
  // 「查看详情」「重新定位」等出口。
  optional string block_action_label = 5;
  BlockAction block_action = 6;
  // 回合进行中：显示「停止」。
  bool can_stop = 7;
  optional string running_turn_id = 8;
  // 「运行时 · 模型」按钮。
  string runtime_model_label = 9;
  // 对话开始后运行时一节置灰。
  bool runtime_locked = 10;
  // 档位按钮。
  ApprovalModeView approval_mode = 11;
  // 上一次添加附件被拒的原因（如拖入的文件超过 20MB）；下一次成功添加后清掉。
  optional string attach_error = 12;
  // 输入框上方的附件托盘：本对话已上传、还没随消息发出的附件。
  repeated AttachmentChip tray = 13;
  // 「运行时 · 模型」菜单（ui-m1.md 第 2 节第 14 条）。
  ModelMenuView model_menu = 14;
  // 正文框里的占位文字：跟答话的助手说（ui-m1.md 3.4 的例子「跟阿森说点什么」）。
  string placeholder = 15;
  // 回形针点不了时的原因（悬停说明）；不设就能点，点了发 PickAttachments。
  optional string attach_unavailable = 16;
}

// 「运行时 · 模型」菜单：运行时、模型（仅本对话）、思考强度三节。选中项与可否选都由 Rust 侧给。
message ModelMenuView {
  repeated MenuChoice runtimes = 1;
  // 模型列表还在取（运行时的模型清单是一次附带查询，取到前显示转圈）。
  bool models_loading = 2;
  repeated MenuChoice models = 3;
  // 当前模型不在列表里（手填的模型 ID）时它的文字；在列表里时为空。
  string custom_model = 4;
  // 运行时不支持思考强度时为空，界面不显示这一节（设计 9.6 第 5 条）。
  repeated MenuChoice efforts = 5;
}

// 菜单里的一项：value 原样回传（模型 ID、思考强度、运行时 ID），label 原样显示。
message MenuChoice {
  string value = 1;
  string label = 2;
  bool selected = 3;
  bool enabled = 4;
  // 不可选时的悬停说明（如「M2 接入」）。
  string tip = 5;
}

enum Tone {
  TONE_UNSPECIFIED = 0;
  TONE_NEUTRAL = 1;
  TONE_WARNING = 2;
}

enum BlockAction {
  BLOCK_ACTION_UNSPECIFIED = 0;
  BLOCK_ACTION_RELOCATE_PROJECT = 1;
  BLOCK_ACTION_OPEN_RUNTIME_DETAILS = 2;
}

message ApprovalModeView {
  string label = 1;
  // 全开：赭红。
  bool full_access = 2;
  // 断链图标：成员单独设置。
  bool overridden = 3;
  repeated OptionView options = 4;
  int32 current = 5;
  string scope_title = 6;
  // 切到全开前的确认框（ui-m1.md 第 2 节第 9 条）：每次切到全开都弹；已经是全开时不设。
  optional ConfirmView full_access_confirm = 7;
  // 盾牌里带勾（自动、全开时）。
  bool shield_checked = 8;
}

// 确认框的全部文字：标题、正文、脚注、确认按钮字样（取消按钮字样固定）。
message ConfirmView {
  string title = 1;
  string body = 2;
  string footnote = 3;
  string confirm_label = 4;
  // 选了哪个选项（OptionView.value）才弹这个确认框。
  int32 for_value = 5;
}

message MessageView {
  string message_id = 1;
}

// 流式追加：消息行接到正文后面，工具行接到输出后面（MessageDelta / ToolOutputDelta）。
message MessageTextAppend {
  // 行的 key（消息行或工具行）。
  string message_id = 1;
  // 追加前这一行正文的长度（UTF-8 字节），网页核对用：对不上就等整行重发。
  uint64 offset = 2;
  string text = 3;
}

message WindowInfo {
  uint32 first_index = 1;
  uint32 count = 2;
  uint32 total = 3;
  // 更早的还有没有（往上翻）。
  bool has_older = 4;
  // 时间线是否接着最新；否则新消息只计数。
  bool at_tail = 5;
  // 「回到最新（N）」。
  uint32 new_below = 6;
  // 往前翻页在飞。
  bool loading_older = 7;
}

// 时间线的一行。ordinal 是 Rust 侧发的稳定行号（往前翻页发负数），网页拿它排序、当高度缓存的键。
message RowView {
  sint64 ordinal = 1;
  string key = 2;
  oneof row {
    MessageRow message = 10;
    ToolRow tool = 11;
    ApprovalRow approval = 12;
    UserActionRow user_action = 13;
    TurnEndRow turn_end = 14;
    ResumeRow resume = 15;
    NoteRow model_switch = 16;
    NoteRow divider = 17;
    NoteRow note = 18;
  }
}

enum Speaker {
  SPEAKER_UNSPECIFIED = 0;
  SPEAKER_USER = 1;
  SPEAKER_ASSISTANT = 2;
  SPEAKER_SYSTEM = 3;
}

message MessageRow {
  string message_id = 1;
  Speaker speaker = 2;
  string author_name = 3;
  AvatarView avatar = 4;
  // 原来的表情枚举，并进了 AvatarView.mood。
  reserved 5;
  reserved "expression";
  string text = 6;
  bool streaming = 7;
  // 「已中断」「失败」；正常为空。
  string status_label = 8;
  repeated AttachmentChip attachments = 9;
  // 正文是制品引用、还没读到。
  bool body_pending = 10;
  // 这一轮失败的说明行（ui-m1.md 2a 第 10 条）：「这一轮没能开始：…」或「这一轮中途失败：…」。
  optional FailureLine failure = 11;
  // 回合一开始就失败、内容为空：不画空气泡，只画说明行。
  bool bubble_hidden = 12;
}

message FailureLine {
  string text = 1;
  // 「详情」展开后的技术信息。
  string detail = 2;
}

message AttachmentChip {
  string attachment_id = 1;
  string name = 2;
  string size_label = 3;
  // 凭据文件等用户确认。
  bool needs_confirmation = 4;
}

message ToolRow {
  string tool_call_id = 1;
  string title = 2;
  string summary = 3;
  bool running = 4;
  bool failed = 5;
  string status_label = 6;
  string output = 7;
}

message ApprovalRow {
  string approval_id = 1;
  string title = 2;
  // 「越界」「沙箱外」等标签。
  repeated string tags = 3;
  string code = 4;
  // AI 审查一行。
  string review_line = 5;
  // 「已允许（你）」「已作废：回合已取消」等；待定为空。
  string state_label = 6;
  bool can_decide = 7;
  // 只列后台给的 offered_remember；value 是不透明的记住范围，原样回传。
  repeated OptionView remember_options = 8;
  // 置灰（已作废）。
  bool muted = 9;
  // 切档放行后的折叠形态。
  bool folded = 10;
  // 沙箱外说明、脚本不可见说明。
  repeated string notes = 11;
}

message UserActionRow {
  string card_id = 1;
  // 命令或补丁二选一。
  string command = 2;
  string cwd = 3;
  string patch_path = 4;
  string diff = 5;
  string reason = 6;
  string state_label = 7;
  bool can_execute = 8;
  bool can_copy = 9;
  bool can_dismiss = 10;
  bool can_stop = 11;
  // 结果未知：「我已核对」。
  bool can_confirm_ended = 12;
  optional string exit_label = 13;
  string output = 14;
  bool muted = 15;
  // 「执行结果未知，请自行核对」等说明。
  optional string notice = 16;
  // 你已执行且退出码 0：结果用成功色（画布 15-UserAction-done）。
  bool succeeded = 17;
}

message TurnEndRow {
  string turn_id = 1;
  // 「搞定」印章，只由回合结束行带（R9）。
  bool celebrate = 2;
  string summary_line = 3;
  repeated string paths = 4;
  // 失败、取消的原因；正常结束为空。
  string outcome_label = 5;
  bool failed = 6;
}

message ResumeRow {
  string turn_id = 1;
  string reason = 2;
  bool can_resume = 3;
  bool can_abandon = 4;
}

message NoteRow {
  string text = 1;
  // 切到全开的那一行（ui-m1 第 2 节第 9 条：全开时提示用赭红色）；网页按它上色，不看文字。
  bool full_access = 2;
}

// ---------- 全部对话 ----------

message HomePatch {
  optional HomeView view = 1;
}

// 首页（画布 01）：对着哪个项目、输入框（和对话里的一样有「运行时 · 模型」与审批档位，值记在 Rust，
// 发出首条消息时随新对话一起设上）。
message HomeView {
  // 首页对着的项目：网页声明了就用它，没声明（或已不在）由 Rust 取侧栏里的第一个；没有项目时为空。
  string project_id = 1;
  string project_name = 2;
  ComposerView composer = 3;
  // 正在新建对话并发出首条消息：发送按钮转圈。
  bool starting = 4;
  // 上一次没能发出去的原因（草稿还在输入框里）；下一次发出时清掉。
  optional string start_error = 5;
}

message ConversationListPatch {
  optional ConversationListView view = 1;
}

message ConversationListView {
  string project_id = 1;
  string filter = 2;
  repeated ConversationItem items = 3;
  bool has_more = 4;
  bool loading = 5;
  // 空、筛选无结果的说明；有条目时为空。
  string empty_text = 6;
}

// ---------- 待你处理 ----------

message PendingPatch {
  optional PendingView view = 1;
}

message PendingView {
  repeated PendingEntry entries = 1;
  string empty_text = 2;
}

enum PendingKind {
  PENDING_KIND_UNSPECIFIED = 0;
  PENDING_KIND_APPROVAL = 1;
  PENDING_KIND_USER_ACTION = 2;
  PENDING_KIND_AGENTS_MD_DRAFT = 3;
  PENDING_KIND_RESUME = 4;
}

message PendingEntry {
  string item_id = 1;
  PendingKind kind = 2;
  string kind_label = 3;
  string title = 4;
  // 所在对话或项目。
  string context_label = 5;
  // 点击跳转：对话与行；草稿卡片没有对话。
  optional string conversation_id = 6;
  optional string row_key = 7;
  optional string project_id = 8;
  // 这一项在某个助手的私聊里：点开进那个助手的主页（私聊 + 资料栏，ui-m1 2a 第 18 条 b）。项目对话不设。
  optional string assistant_id = 9;
}

// ---------- 设置 ----------

message SettingsPatch {
  optional SettingsView view = 1;
}

message SettingsView {
  bool playful_ui = 1;
  bool autostart = 2;
  string projects_root = 3;
  repeated RuntimeView runtimes = 4;
  repeated RuleGroup rule_groups = 5;
  bool rules_loading = 6;
  string rules_empty_text = 7;
  repeated ImportGroup import_groups = 8;
  string import_empty_text = 9;
  // 关于页「版本 x.y.z」里的版本号：客户端自己的构建版本，不依赖后台（ui-m1 2a 第 18 条 g ③）。
  string app_version = 10;
}

message RuntimeView {
  string runtime_id = 1;
  string display_name = 2;
  string state_label = 3;
  // 验证状态只在设置 › 运行时、引导页与诊断页出现（R10）。
  optional string verification_label = 4;
  string version_label = 5;
  string login_label = 6;
  // 未安装、未登录：文字指引 + 「重新检测」。
  optional string guidance = 7;
  bool can_redetect = 8;
  bool ready = 9;
  // 还没接入（M2）的运行时：只列名字与「M2 接入」，置灰（画布 12、ui-m1 第 1 节引导页一行）。
  bool upcoming = 10;
}

message RuleGroup {
  string title = 1;
  repeated RuleItem rules = 2;
}

message RuleItem {
  string rule_id = 1;
  // 原文（读屏、复制用）；画的时候用 label_spans。
  string label = 2;
  bool can_revoke = 3;
  // label 按反引号切开：code 的一段照代码样式画（ui-m1 第 2 节第 15 条的例子「执行 `npm test …`」）。
  repeated TextSpan label_spans = 4;
  // 记在哪个助手或项目上（如「项目 demo」「助手 阿森」「所有项目与助手」）。
  string owner_label = 5;
  // 创建时间（今天写时刻，更早写日期）；后台没给就不设。
  string created_label = 6;
}

message TextSpan {
  string text = 1;
  bool code = 2;
}

message ImportGroup {
  string title = 1;
  repeated ImportItem items = 2;
}

message ImportItem {
  string item_id = 1;
  string name = 2;
  string description = 3;
  string source = 4;
  bool imported = 5;
}

// ---------- 助手主页 ----------

message AssistantProfilePatch {
  optional AssistantProfileView view = 1;
}

message AssistantProfileView {
  string assistant_id = 1;
  string name = 2;
  AvatarView avatar = 3;
  string prompt = 4;
  string runtime_id = 5;
  string model_id = 6;
  string effort = 7;
  repeated ToolToggle tools = 8;
  bool builtin = 9;
  bool can_delete = 10;
  // 删除确认框里写的私聊工作目录。
  string dm_workdir = 11;
  uint32 version = 12;
  repeated OptionView runtime_options = 13;
  bool runtime_locked = 14;
  // 「动态」「记忆」空态说明（D3）。
  string activity_empty_text = 15;
  string memory_empty_text = 16;
  // 运行时 / 模型 / 思考强度三个下拉（同一套 model_menu 派生，ui-m1 第 2 节第 14 条）。
  ModelMenuView model_menu = 17;
  // 自动保存没成功的说明（字段非法、后台校验拒）；下一次改动清掉。
  optional string save_error = 18;
  // 配置页「头像配色」的 8 个色块（ui-m1 2a 第 18 条 a），按显示顺序；选中即保存。
  repeated AvatarColorOption avatar_colors = 19;
  // 资料栏本可常驻（主区域够宽）时用户手动收起了：全局偏好 GlobalSettings.profile_panel_collapsed。
  // 常驻还是收起由网页按主区域宽度判（ui-m1 2a 第 18 条 d，布局事实），这个值只管够宽时。
  bool profile_panel_collapsed = 20;
}

message AvatarColorOption {
  // 设计令牌名，原样回传（UpdateAssistantFieldIntent.avatar_color）；网页画成 var(--<名>)。
  string token = 1;
  // 读屏名称，如「头像配色 赭红」。
  string label = 2;
  bool selected = 3;
}

message ToolToggle {
  int32 group = 1;
  string label = 2;
  bool enabled = 3;
}

// ---------- 添加项目 ----------

message AddProjectPatch {
  optional AddProjectView view = 1;
}

message AddProjectView {
  optional CloneProgressView clone = 1;
  repeated DraftCardView drafts = 2;
  // 选中的文件夹与检查结果；没选时不设（T09 方案 15.2）。
  optional CandidateView candidate = 3;
  // 新建、克隆要放到的父目录（家目录写成 ~）。
  string parent_label = 4;
  // 上一次操作被拒的原因（目录非空、没配提交身份等，文字用后台给的）。
  optional string error = 5;
  // 「Claude Code（全局默认）」那一行。
  string runtime_label = 6;
  // 正在加或正在新建：主按钮转圈、不可点。
  bool busy = 7;
}

message CandidateView {
  // 给人看的路径（家目录写成 ~）。会被加进来的那个目录：选了子目录时这里是仓库根。
  string path_label = 1;
  // 检查还没回来。
  bool checking = 2;
  // 提示框：没有版本控制、选的是子目录、检查失败。没有就都为空。
  string notice_title = 3;
  string notice_body = 4;
  Tone notice_tone = 5;
  // 「初始化为 git 仓库并首次提交」那个按钮：显不显示、文字、是不是正在初始化。
  optional string init_label = 6;
  bool initializing = 7;
  // 「AGENTS.md　未找到 / 已有」；检查中为空。
  string agents_md_label = 8;
  // 显不显示「让 iWork 生成草稿」的勾选框，以及勾着没。
  bool can_propose_draft = 9;
  bool propose_draft = 10;
  // 主按钮：可不可点、文字（「添加并开始对话」「打开已有项目」）。
  bool can_confirm = 11;
  string confirm_label = 12;
}

message CloneProgressView {
  string job_id = 1;
  string phase = 2;
  uint32 percent = 3;
  string text = 4;
  optional string error = 5;
  bool can_retry = 6;
}

message DraftCardView {
  string card_id = 1;
  string project_id = 2;
  string project_name = 3;
}

// ---------- 连接 ----------

message ConnectionPatch {
  optional ConnectionView view = 1;
}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  // 正常。
  CONNECTION_STATE_LIVE = 1;
  // 首次连接中、或订阅快照还没到齐。
  CONNECTION_STATE_CONNECTING = 2;
  // 顶部细条「正在重新连接」。
  CONNECTION_STATE_RECONNECTING = 3;
  // 整页中性提示（版本不一致、正在切换版本）。
  CONNECTION_STATE_WAITING = 4;
  // 诊断页。
  CONNECTION_STATE_DIAGNOSTICS = 5;
  // 整页说明、不自动重拨（如 M1 的 Windows）。
  CONNECTION_STATE_ENVIRONMENT = 6;
}

message ConnectionView {
  // 原来的出口纯文字：换成了带动作的 exit_actions（网页不按文字猜动作）。
  reserved 4;
  reserved "exits";
  ConnectionState state = 1;
  string title = 2;
  string message = 3;
  // 「后台负载过高」提示条；不过载时不设。
  optional string overload_notice = 5;
  // 会发命令的按钮可不可点（断线时不可点，D8）。
  bool commands_enabled = 6;
  optional DiagnosticsView diagnostics = 7;
  // 菜单点了「完全退出 iWork」：网页弹确认框，确认后发 QuitIntent{confirm: true}。
  bool quit_requested = 8;
  // 有数据没取到、正在退避重试时的一行说明（如「部分数据暂时没取到，稍后自动重试」）；没有就不设。
  optional string query_notice = 9;
  // 整页提示上的出口：只列 Rust 有实现的（查看诊断等 T04p 接上真诊断再给）。
  repeated ConnectionExit exit_actions = 10;
}

message ConnectionExit {
  string label = 1;
  ConnectionExitKind kind = 2;
}

enum ConnectionExitKind {
  CONNECTION_EXIT_KIND_UNSPECIFIED = 0;
  // 发 UiIntent.retry。
  CONNECTION_EXIT_KIND_RETRY = 1;
  // 打开诊断页（T04p 步 10 接真 Diagnostics 后才给）。
  CONNECTION_EXIT_KIND_SHOW_DIAGNOSTICS = 2;
  // 发 UiIntent.relaunch：只重启客户端自己，不碰后台。
  CONNECTION_EXIT_KIND_RELAUNCH = 3;
}

message DiagnosticsView {
  repeated DiagnosticLine lines = 1;
  // 「装回更新的那一版可继续使用」等提示。
  optional string hint = 2;
  bool can_retry = 3;
}

message DiagnosticLine {
  string label = 1;
  string value = 2;
}

// ---------- 网页 → Rust：三个 invoke 命令的载荷 ----------

// attach 的回包。
message AttachReply {
  uint32 epoch = 1;
}

// next_frame 的请求。applied 是网页已经应用到的最后一块；还没收到过任何块时不设。
message NextFrame {
  uint32 epoch = 1;
  optional FramePosition applied = 2;
}

message FramePosition {
  uint64 frame = 1;
  uint32 index = 2;
}

// next_frame 的回包：一帧编码后的 ViewPatch 按 256 KiB 切成的一块。收齐 last 再解码。
message FrameChunk {
  uint32 epoch = 1;
  uint64 frame = 2;
  uint32 index = 3;
  bool last = 4;
  bytes data = 5;
}

// ui_intent 的请求。
message UiIntent {
  // 原来网页直接带路径的几个操作，换成了 Rust 弹选择框的 pick_*（R7：网页拿不到本机路径；T09 组 2b、组 3）。
  reserved 60, 70, 73;
  reserved "attach_paths", "add_project", "relocate_project";
  oneof kind {
    // 视图声明
    SetVisible set_visible = 1;
    SetVisibleRows set_visible_rows = 2;
    LoadOlder load_older = 3;
    JumpToLatest jump_to_latest = 4;
    SetFocused set_focused = 5;
    LoadMoreConversations load_more_conversations = 6;
    Retry retry = 7;
    OpenExternal open_external = 8;
    // 消息锚点（T09 方案 2.9）
    AnchorBrowse anchor_browse = 9;
    JumpToAnchor jump_to_anchor = 10;
    JumpRelative jump_relative = 11;

    // 对话
    SendMessageIntent send_message = 20;
    CreateConversationIntent create_conversation = 21;
    RenameConversationIntent rename_conversation = 22;
    DeleteConversationIntent delete_conversation = 23;
    TurnIntent cancel_turn = 24;
    TurnIntent resume_turn = 25;
    TurnIntent abandon_turn = 26;
    SetModelIntent set_model = 27;
    SwitchDmProjectIntent switch_dm_project = 28;
    SetApprovalModeIntent set_approval_mode = 29;
    // 首页：新建对话并发出首条消息（建好、设上首页选的模型与档位、发出后跳过去）。
    StartConversationIntent start_conversation = 30;
    // 首页的「运行时 · 模型」与档位：记在 Rust，新建对话时带上。
    HomeModelIntent set_home_model = 31;
    HomeApprovalModeIntent set_home_approval_mode = 32;

    // 卡片
    DecideApprovalIntent decide_approval = 40;
    CardIntent execute_user_action = 41;
    CardIntent dismiss_user_action = 42;
    CardIntent stop_user_action = 43;
    CardIntent confirm_user_action_ended = 44;
    AttachmentIntent confirm_credential_attachment = 45;
    DraftIntent decide_agents_md_draft = 46;

    // 附件。本机文件只经系统选择框或拖入进来，路径由 Rust 侧拿（网页拿不到文件能力，方案 R7）：
    // 网页只说「要选附件」，不带路径。
    AttachPasted attach_pasted = 61;
    PickAttachments pick_attachments = 62;

    // 项目
    PinProjectIntent pin_project = 71;
    ProjectIntent remove_project = 72;
    // 「重新定位」：Rust 弹文件夹选择框，选好后发 RelocateProject，由后台校验 project.toml。
    ProjectIntent pick_project_location = 74;
    // 添加项目一组（T09 方案 15.2）：都不带路径，路径只在 Rust 的添加项目草稿里（RD1）。
    // 弹选文件夹的框，选好的设成候选、发检查。
    PickProjectFolder pick_project_folder = 75;
    // 候选没有版本控制时：初始化它。
    InitCandidateRepository init_candidate_repository = 76;
    // 「让 iWork 生成 AGENTS.md 草稿」。
    ToggleIntent set_propose_agents_md_draft = 77;
    // 「添加并开始对话」/「打开已有项目」。
    ConfirmAddProject confirm_add_project = 78;
    // 弹窗关了：清掉草稿。
    ClearAddProject clear_add_project = 79;
    // 新建项目：name 只当一个目录名，由后台判（方案 15.2「从网页来的字符串」）。
    CreateProjectIntent create_project = 92;
    // 克隆：url 只收远程地址、name 只当一个目录名，都由后台判。
    StartCloneIntent start_clone = 93;
    // 用上一次的参数重新克隆（参数记在 Rust，网页不重传）。
    RetryClone retry_clone = 94;
    // 弹选文件夹的框，选好的作为这一次新建、克隆的父目录。
    PickProjectsParent pick_projects_parent = 95;
    // 设置 › 项目位置的「更换」：Rust 弹文件夹选择框，选好后发 SetProjectsRoot（方案 15.2）。
    PickProjectsRoot pick_projects_root = 96;

    // 助手与设置
    AssistantEditIntent create_assistant = 80;
    AssistantEditIntent update_assistant = 81;
    AssistantIntent delete_assistant = 82;
    ToggleIntent set_playful_ui = 83;
    ToggleIntent set_autostart = 84;
    RuleIntent revoke_rule = 85;
    RuntimeIntent redetect_runtime = 86;
    // 「完全退出 iWork」确认框的结果：确认则关后台服务并退出，取消则关掉确认框。
    QuitIntent quit = 87;
    // 助手配置页改了一项（自动保存）：Rust 合并、按版本发 UpdateAssistant（store::assistant_edits）。
    UpdateAssistantFieldIntent update_assistant_field = 88;
    // 连接类整页的「重新打开 iWork」：壳重启客户端进程，不碰后台。
    RelaunchIntent relaunch = 89;
    // 助手资料栏常驻时点「助手资料」手动收起（on = 收起）/ 展开：全局一个偏好，发 SetProfilePanelCollapsed。
    ToggleIntent set_profile_panel_collapsed = 97;
    // 锚点列表里按 Home / End：以整个对话最早 / 最新的一处为中心重取（不跳转）。
    AnchorBrowseEdge anchor_browse_edge = 98;
    // 从「待你处理」进对话：定位到那张卡片（ui-m1 2a 第 18 条 b）。紧跟在 SetVisible 后面发。
    JumpToRow jump_to_row = 99;
  }
}

message RelaunchIntent {}

message QuitIntent {
  bool confirm = 1;
}

// 网页当前可见的视图（整份声明，替换上一次）。
message SetVisible {
  bool sidebar = 1;
  optional string conversation_id = 2;
  bool pending = 3;
  bool settings = 4;
  optional string assistant_id = 5;
  bool add_project = 6;
  // 「全部对话」列表页：项目与筛选文字。
  optional ConversationListQuery conversation_list = 7;
  // 首页。
  optional HomeQuery home = 8;
}

message HomeQuery {
  // 路由里带的项目；空表示由 Rust 挑（HomeView.project_id）。
  string project_id = 1;
}

message ConversationListQuery {
  string project_id = 1;
  string filter = 2;
}

// 网页声明的行窗口（按 ordinal，闭区间）。Rust 只发窗口前后各多 30 行以内的行。
message SetVisibleRows {
  string conversation_id = 1;
  sint64 first_ordinal = 2;
  sint64 last_ordinal = 3;
  // 这次范围变化来自用户自己的滚动（滚轮、触摸、按键、拖滚动条），不是跳转、新消息贴底这类程序滚动。
  // 用户滚动会作废等待中的锚点跳转（T09 方案 2.9「跳转」第 3 条）。
  bool by_user = 4;
}

message LoadOlder {
  string conversation_id = 1;
}

message JumpToLatest {
  string conversation_id = 1;
}

// 滚轮翻看到了离窗口边缘不远的一处：Rust 以那一处为中心重取锚点窗口（不跳转）。
message AnchorBrowse {
  string conversation_id = 1;
  string key = 2;
}

// 跳到待处理卡片所在的行（PendingEntry.row_key）。卡片不在时间线里时由 Rust 以它为中心取那一段，
// 与点锚点跳转同一套加载、移窗与作废时序（方案 2.9）。
message JumpToRow {
  string conversation_id = 1;
  string row_key = 2;
}

// Home / End：网页不知道窗口外最早、最新那一处的 key，只说要哪一头。
message AnchorBrowseEdge {
  string conversation_id = 1;
  // 真 = 最新一头（End），假 = 最早一头（Home）。
  bool latest = 2;
}

// 点了刻度或信息卡：跳到那一处（没加载就先取以它为中心的一段）。
message JumpToAnchor {
  string conversation_id = 1;
  string key = 2;
}

// ⌥↑ / ⌥↓：相对当前位置跳一处（-1 往前，+1 往后）。
message JumpRelative {
  string conversation_id = 1;
  sint32 delta = 2;
}

message SetFocused {
  bool focused = 1;
}

message LoadMoreConversations {}

message Retry {}

message OpenExternal {
  string url = 1;
}

message SendMessageIntent {
  string conversation_id = 1;
  string text = 2;
  repeated string attachment_ids = 3;
}

message CreateConversationIntent {
  string project_id = 1;
}

message RenameConversationIntent {
  string conversation_id = 1;
  string title = 2;
}

message DeleteConversationIntent {
  string conversation_id = 1;
}

message TurnIntent {
  string turn_id = 1;
}

message SetModelIntent {
  string conversation_id = 1;
  string model_id = 2;
  optional string effort = 3;
}

message SwitchDmProjectIntent {
  string conversation_id = 1;
  // 空表示切回纯私聊。
  string project_id = 2;
}

message StartConversationIntent {
  string project_id = 1;
  string text = 2;
}

message HomeModelIntent {
  string model_id = 1;
  optional string effort = 2;
}

message HomeApprovalModeIntent {
  // ApprovalModeView.options 里的 value。
  int32 mode = 1;
}

message SetApprovalModeIntent {
  string conversation_id = 1;
  // ApprovalModeView.options 里的 value。
  int32 mode = 2;
}

message DecideApprovalIntent {
  string approval_id = 1;
  bool allow = 2;
  // ApprovalRow.remember_options 里的 value；不记住时为 0。
  int32 remember = 3;
}

// 亲手执行卡片：提议哈希由 Rust 从实体取，网页只给卡片 id（R7）。
message CardIntent {
  string card_id = 1;
}

message AttachmentIntent {
  string attachment_id = 1;
}

message DraftIntent {
  string card_id = 1;
  bool accept = 2;
}

// 回形针：Rust 弹文件选择框，选中的本机文件只传路径（设计 3.7），附到这个对话。
message PickAttachments {
  string conversation_id = 1;
}

// 粘贴的数据：Rust 侧做 20MB 检查后用 Chunk 上传。
message AttachPasted {
  string conversation_id = 1;
  string name = 2;
  string mime = 3;
  bytes data = 4;
}

message PickProjectsRoot {}

message PickProjectFolder {}

message InitCandidateRepository {}

message ConfirmAddProject {}

message ClearAddProject {}

message RetryClone {}

message PickProjectsParent {}

message CreateProjectIntent {
  string name = 1;
}

message StartCloneIntent {
  string url = 1;
  optional string name = 2;
}

message PinProjectIntent {
  string project_id = 1;
  bool pinned = 2;
}

message ProjectIntent {
  string project_id = 1;
}

message AssistantEditIntent {
  // 新建时为空。
  string assistant_id = 1;
  string name = 2;
  string prompt = 3;
  string runtime_id = 4;
  string model_id = 5;
  optional string effort = 6;
  repeated int32 disabled_groups = 7;
  string avatar_initial = 8;
  string avatar_color = 9;
}

// 助手配置页的一项改动。网页不拼整份配置、不管版本：同一个助手的改动由 Rust 排队合并（步 7c）。
message UpdateAssistantFieldIntent {
  string assistant_id = 1;
  oneof field {
    string name = 2;
    string prompt = 3;
    ModelChoice model = 4;
    ToolChoice tool = 5;
    // 头像配色：AvatarColorOption.token。
    string avatar_color = 6;
  }
}

// 模型与思考强度一起改（菜单里是同一次选择）；value 取 ModelMenuView 里的。
message ModelChoice {
  string model_id = 1;
  optional string effort = 2;
}

message ToolChoice {
  // ToolToggle.group。
  int32 group = 1;
  bool enabled = 2;
}

message AssistantIntent {
  string assistant_id = 1;
}

message ToggleIntent {
  bool on = 1;
}

message RuleIntent {
  string rule_id = 1;
}

message RuntimeIntent {
  string runtime_id = 1;
}

// ui_intent 的回包：受理结果。被后台拒绝或本地校验不过时带错误，网页显示成提示。
message IntentAck {
  optional IntentError error = 1;
}

message IntentError {
  // 机器可读的错误名（如 "approval_not_pending"、"attachment_too_large"、"offline"）。
  string code = 1;
  string message = 2;
  bool retryable = 3;
}
