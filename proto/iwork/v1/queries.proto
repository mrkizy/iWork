// 查询：客户端 → 后台，只读，返回快照与快照对应的 seq（设计 3.4）。
//
// 兼容规则：字段只增不改号；删字段先 `reserved` 编号与名字（同一主版本内只标 deprecated 不删）；
// 枚举值同理；不改 oneof 字段的类型。全文见 proto/compat/README.md，由 tests/compat.rs 检查。
syntax = "proto3";

package iwork.v1;

import "google/protobuf/timestamp.proto";
import "iwork/v1/common.proto";
import "iwork/v1/model.proto";

// 查询信封。QueryResult 的 oneof 用同一个编号放对应结果，读起来一一对得上。
message Query {
  oneof kind {
    GetConversation get_conversation = 10;
    ListConversations list_conversations = 11;
    ListProjects list_projects = 12;
    ListAssistants list_assistants = 13;
    ListPendingItems list_pending_items = 14;
    GetQuota get_quota = 15;
    GetRuntimeStatus get_runtime_status = 16;
    ListModels list_models = 17;
    ListRules list_rules = 18;
    ListLocalConfig list_local_config = 19;
    ListSecurityLists list_security_lists = 20;
    GetSettings get_settings = 21;
    ReadArtifact read_artifact = 22;
    // 消息锚点：以某个位置为中心按窗口取（T09 方案 2.9、G10）。
    ListAnchors list_anchors = 23;
    // 被系统通知叫到前台时跳到哪（T09 方案 2.8）：附带查询，结果不进视图。
    GetOpenTarget get_open_target = 24;
    // 添加项目之前看一眼选的目录（T09 方案 15.2）：附带查询，只读，不产生事件。
    InspectProjectPath inspect_project_path = 25;
  }
}

message QueryResult {
  // 快照对应的事件 seq；ReadArtifact（制品不可变）填当前 head_seq。
  uint64 seq = 1;
  oneof kind {
    GetConversationResult get_conversation = 10;
    ListConversationsResult list_conversations = 11;
    ListProjectsResult list_projects = 12;
    ListAssistantsResult list_assistants = 13;
    ListPendingItemsResult list_pending_items = 14;
    GetQuotaResult get_quota = 15;
    GetRuntimeStatusResult get_runtime_status = 16;
    ListModelsResult list_models = 17;
    ListRulesResult list_rules = 18;
    ListLocalConfigResult list_local_config = 19;
    ListSecurityListsResult list_security_lists = 20;
    GetSettingsResult get_settings = 21;
    ArtifactChunk read_artifact = 22;
    ListAnchorsResult list_anchors = 23;
    GetOpenTargetResult get_open_target = 24;
    InspectProjectPathResult inspect_project_path = 25;
  }
}

// 加之前看一眼这个目录：只读，不产生事件，不写任何东西。结果只用来画界面；能不能加以 AddProject 受理时再判
// 一次为准（T09 方案 15.2、RD2）。路径不存在、不是目录、读不了：回错，用 AddProject 已有的错误码。
message InspectProjectPath {
  string path = 1;
}

message InspectProjectPathResult {
  ProjectPathState state = 1;
  // 会被加进来的目录：受版本控制时是仓库根（选的是子目录就和 path 不一样），否则是 path 自己。都是规范化后的绝对路径。
  string root_path = 2;
  // 项目名的默认取法：root_path 的最后一段。
  string name = 3;
  // state = KNOWN 时：已有项目的 id。
  optional string project_id = 4;
  // root_path 下有没有 AGENTS.md。只看在不在，不读内容。
  bool has_agents_md = 5;
}

enum ProjectPathState {
  PROJECT_PATH_STATE_UNSPECIFIED = 0;
  // 受版本控制，还没登记：可以加。
  PROJECT_PATH_STATE_ADDABLE = 1;
  // 没有版本控制：要先初始化（InitRepository）。
  PROJECT_PATH_STATE_NOT_VERSION_CONTROLLED = 2;
  // 已经是列表里的项目（按仓库共享目录去重，设计 8.2）。
  PROJECT_PATH_STATE_KNOWN = 3;
}

// 用户最近点过的那条系统通知指向哪（T09 方案 2.8）。后台只记用户确实点过的那一项；拿不到「点了哪一项」时不记。
message GetOpenTarget {}

message GetOpenTargetResult {
  // 每记下一个新目标加一；0 表示没有。
  uint64 token = 1;
  string pending_item_id = 2;
  // AGENTS.md 草稿这类没有对话归属的项不设。
  optional string conversation_id = 3;
  // 用户点这条通知的时刻。
  google.protobuf.Timestamp at = 4;
  // 后台这一次运行的标识（每次启动新生成）。token 只在同一个 boot_id 里递增，后台重启后从头数：客户端按
  // (boot_id, token) 认新旧，不能只比 token（T10a 审查 2026-11-14-m1-t10a-8a 1/F-1）。
  string boot_id = 5;
}

// 键集分页：十万条历史（设计 5.3 索引）。三种取页方式至多设一个（同时设两个以上回 INVALID_ARGUMENT），
// 都不设取最新的一页：
//   before_message_id 往前翻一页；after_message_id 往后翻一页（T09 方案 G11）；
//   around_seq 以这个位置为中心取 limit 条消息，连同范围内的回合、工具调用、审批、卡片（跳到没加载的锚点）。
// 取页方式（T09 方案 G11、2.9）：什么都不设 = 最新页；before_message_id、after_message_id、around_seq、
// before_seq、after_seq 至多设一个，设了两个以上回 INVALID_ARGUMENT。
// 前三种按消息数取（limit 是消息条数，连同范围内的回合、工具调用、审批、卡片）；
// 行级游标按行数取（limit 是行数，0 回 INVALID_ARGUMENT，大于 1000 按 1000；游标为 0 回 INVALID_ARGUMENT）：
// 「行」是消息、工具调用、审批、亲手执行卡片（排序字段 created_seq）与回合结束（Turn.ended_seq）。
message GetConversation {
  string conversation_id = 1;
  optional string before_message_id = 2;
  uint32 limit = 3;
  optional string after_message_id = 4;
  optional uint64 around_seq = 5;
  // 排序字段小于它的各类行里，紧挨着它的 limit 行。
  optional uint64 before_seq = 6;
  // 排序字段大于它的各类行里，紧挨着它的 limit 行。
  optional uint64 after_seq = 7;
}

message GetConversationResult {
  Conversation conversation = 1;
  // 按创建顺序从旧到新。
  repeated Message messages = 2;
  // 本页消息涉及的回合。
  repeated Turn turns = 3;
  // 更早的消息还有没有。
  bool has_more = 4;
  // 本页回合的工具调用、审批（含终态）、亲手执行卡片，本页消息的附件（T09 方案 G3）。
  repeated ToolCall tool_calls = 5;
  repeated Approval approvals = 6;
  repeated UserActionCard user_actions = 7;
  repeated Attachment attachments = 8;
  // 整个对话的累计用量（标题栏「本对话用量」）。
  Usage usage_total = 9;
  // 更新的消息还有没有（往后翻、居中取时有意义；取最新一页时为假）。
  bool has_newer = 10;
  // 这个对话的全部会话替换，按 seq 从旧到新；不跟消息分页（量很小）。诊断用（T10a 任务卡范围 2）。
  repeated SessionReplacementView session_replacements = 11;
}

// 一次运行时会话的替换：续接时会话记录用不了，换了一条新会话（T06 方案 5.2a）。
message SessionReplacementView {
  string turn_id = 1;
  // 记下这次替换的 TurnSessionBound 的 seq；同一对话里唯一，当行的 key。
  uint64 seq = 2;
  string old_runtime_session_id = 3;
  string new_runtime_session_id = 4;
  SessionLostReason reason = 5;
  // 同一回合后面又记回了旧编号：这次替换被退回了。
  bool rolled_back = 6;
  // 那条事件落盘的时间。客户端按本机时区格式化。
  google.protobuf.Timestamp at = 7;
}

// 消息锚点（T09 方案 2.9、G10）：用户消息、等你处理的事、失败的回合按 created_seq 合在一起，
// 以 around_seq 为中心前后各取若干条。哪些算锚点只在后台算，客户端不从已加载的行里挑。
message ListAnchors {
  string conversation_id = 1;
  // 以这个位置为中心；0 = 从最新往回取。
  uint64 around_seq = 2;
  // created_seq 不大于 around_seq 的，最多取这么多条。
  uint32 before = 3;
  // 大于 around_seq 的，最多取这么多条。
  uint32 after = 4;
}

message ListAnchorsResult {
  // 按 created_seq 升序。
  repeated Anchor anchors = 1;
  bool has_before = 2;
  bool has_after = 3;
  // 整个对话里等你处理的锚点数、失败回合的锚点数。
  uint32 waiting_count = 4;
  uint32 failed_count = 5;
}

message Anchor {
  // 与时间线行的排序键同一个数（T09 方案 2.2 行登记表）。
  uint64 created_seq = 1;
  google.protobuf.Timestamp at = 2;
  oneof kind {
    UserMessageAnchor user_message = 10;
    WaitingAnchor waiting = 11;
    FailedTurnAnchor failed_turn = 12;
  }
}

message UserMessageAnchor {
  string message_id = 1;
  // 正文开头，后台截到 200 个字素簇。
  string excerpt = 2;
}

// 审批、亲手执行卡片、继续卡片；处理掉就不再是锚点。
message WaitingAnchor {
  string pending_item_id = 1;
}

message FailedTurnAnchor {
  string turn_id = 1;
  string reason = 2;
  // 失败前有没有输出过内容（「没能开始」还是「中途失败」）。
  bool had_output = 3;
}

message ListConversations {
  // 未设置表示全部（含私聊）。
  optional string project_id = 1;
  // 按标题筛选（包含，不区分大小写）；筛选在后台做（T09 方案 G8）。
  optional string title_contains = 2;
  // 上一批最后一条的游标（取自上一批最后一个 Conversation 的 id）；不设表示从最近活动的开始。
  optional string before = 3;
  // 每批条数；0 表示不分页（侧栏快照用）。按最近活动倒序。
  uint32 limit = 4;
}

message ListConversationsResult {
  repeated Conversation conversations = 1;
  // 分页时：后面还有没有。
  bool has_more = 2;
}

message ListProjects {}

message ListProjectsResult {
  repeated Project projects = 1;
}

message ListAssistants {}

message ListAssistantsResult {
  repeated Assistant assistants = 1;
  // 每个助手至多一条最近动态；从没说过话的助手没有（T09 方案 G7）。
  repeated AssistantActivity activities = 2;
}

// 助手的最近动态：跨这个助手参与的全部对话，按 等你处理 > 运行中 > 最近一条发给用户的消息 取一条。
message AssistantActivity {
  string assistant_id = 1;
  AssistantActivityKind kind = 2;
  string conversation_id = 3;
  // WAITING 时：待处理项的 id（审批 id、卡片 id 或回合 id）。
  optional string pending_item_id = 4;
  // MESSAGE 时：那条消息的首行。
  optional string message_first_line = 5;
}

enum AssistantActivityKind {
  ASSISTANT_ACTIVITY_KIND_UNSPECIFIED = 0;
  ASSISTANT_ACTIVITY_KIND_WAITING = 1;
  ASSISTANT_ACTIVITY_KIND_RUNNING = 2;
  ASSISTANT_ACTIVITY_KIND_MESSAGE = 3;
}

message ListPendingItems {}

message ListPendingItemsResult {
  repeated PendingItem items = 1;
}

message GetQuota {}

// 按运行时分组：M1 只有一个运行时，但侧栏会同时显示多家（设计 9.4），分组避免以后改形状。
message GetQuotaResult {
  repeated RuntimeQuota runtimes = 1;
}

message RuntimeQuota {
  string runtime_id = 1;
  repeated QuotaWindow windows = 2;
  google.protobuf.Timestamp observed_at = 3;
}

message GetRuntimeStatus {}

message GetRuntimeStatusResult {
  repeated RuntimeStatus runtimes = 1;
}

message ListModels {
  string runtime_id = 1;
}

// 运行时不支持思考强度时 effort_levels 为空，界面不显示这一项（设计 9.6 第 5 条）。
message ListModelsResult {
  repeated ModelOption models = 1;
  repeated string effort_levels = 2;
}

message ListRules {
  // 未设置表示全部范围。
  optional string project_id = 1;
}

message ListRulesResult {
  repeated Rule rules = 1;
}

message ListLocalConfig {
  string runtime_id = 1;
}

message ListLocalConfigResult {
  repeated LocalConfigItem items = 1;
}

message ListSecurityLists {}

// 三张清单的条目放在一起，都是规则条目：按 Rule.layer 区分清单，内置看 source 是否为 builtin，范围在 scope。
message ListSecurityListsResult {
  repeated Rule rules = 1;
}

message GetSettings {
  // 设置时一并返回该项目的设置。
  optional string project_id = 1;
}

message GetSettingsResult {
  GlobalSettings global = 1;
  ProjectSettings project = 2;
}

// 分段读制品（设计 3.7）。规则（T01 方案 3.3）：
// - 只接受通过了对端校验的客户端连接；area = PRIVATE 一律 PERMISSION_DENIED；
// - 引用必须被当前数据库里的消息、工具调用、附件或亲手执行卡片引用，否则 ARTIFACT_NOT_FOUND；
// - limit 上限 1MB；offset > total_size 返回 ARTIFACT_RANGE_INVALID。
message ReadArtifact {
  ArtifactRef artifact = 1;
  uint64 offset = 2;
  uint32 limit = 3;
}

// offset == total_size 时 data 为空且 eof = true；offset + len(data) == total_size 时 eof = true。
// 客户端按 eof 判断读完，不靠猜大小。
message ArtifactChunk {
  bytes data = 1;
  uint64 offset = 2;
  uint64 total_size = 3;
  bool eof = 4;
}
