[package]
name = "iwork-fake-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 开发与测试用的假后台（T09 方案 2.6）：内存事件日志 + 真 iwork-ipc 服务端 + 场景登记表。
# 默认不开 iwork-ipc/dev：工作区特性合并会把它带进发布图（scripts/check-no-dev-trust.sh ①）。
# 默认按真校验（RequireSigner）只认同一个可执行文件，进程内测试够用；bin 要接受 Tauri 客户端，得开 dev。

[dependencies]
iwork-proto.workspace = true
iwork-app.workspace = true
iwork-ipc.workspace = true
bytes.workspace = true
prost-types.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true

[dev-dependencies]
prost.workspace = true
tempfile.workspace = true

[features]
# 只转发到 iwork-ipc/dev（DevTrust）；不是默认 feature。bin 必须开它。
dev = ["iwork-ipc/dev"]

[[bin]]
name = "iwork-fake-daemon"
path = "src/main.rs"
required-features = ["dev"]
