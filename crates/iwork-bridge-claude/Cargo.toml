[package]
name = "iwork-bridge-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# 测试用的假 CLI（方案 15.1）：只在这个 feature 下编译，不进发布包。测试经 cargo 按需构建它（tests/support）
fake-cli = ["dep:serde"]
# 故障注入（方案 4.3）：开了才认环境变量 IWORK_BRIDGE_HOOK_TIMEOUT_SECS，把 hook 的 timeout 调短。非默认，
# 发布构建不带（scripts/check-no-dev-trust.sh 查 feature 图）
fault-injection = []

[[test]]
name = "fault_injection"
required-features = ["fault-injection", "fake-cli"]

[[bin]]
name = "iwork-fake-claude"
path = "src/bin/iwork-fake-claude.rs"
required-features = ["fake-cli"]

[dependencies]
iwork-proto.workspace = true
iwork-claude-hook.workspace = true
prost.workspace = true
base64.workspace = true
serde_json.workspace = true
serde = { workspace = true, optional = true }
getrandom.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
agent-client-protocol.workspace = true
futures.workspace = true
prost-types.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# 对拍：桥接取到的对端凭据与 iwork-ipc 的 Connection::peer() 一致（T06 方案 2.1）
[target.'cfg(unix)'.dev-dependencies]
iwork-ipc.workspace = true
# 端到端：经真实的 ACP 客户端驱动桥接（方案 15.3「三条都经真实的 iwork-agent-acp 客户端断言 AgentUpdate」）
iwork-agent-acp.workspace = true
iwork-ports.workspace = true
iwork-domain.workspace = true
