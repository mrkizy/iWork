[package]
name = "iwork-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
iwork-domain.workspace = true
iwork-ports.workspace = true
iwork-proto.workspace = true
iwork-core.workspace = true
iwork-app.workspace = true
iwork-store.workspace = true
iwork-agent-acp.workspace = true
iwork-vcs-git.workspace = true
iwork-host.workspace = true
iwork-ipc.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
serde_json.workspace = true
thiserror.workspace = true
ulid = { workspace = true, features = ["std"] }
# 出包前的核对把叶证书的 SHA-256 写成十六进制（install::package_check、examples/check-install）
hex.workspace = true

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW：锁文件、日志文件不跟随链接打开
libc.workspace = true

[features]
# 开发开关 --dev-trust（跳过签名校验，同用户照查）。不是默认 feature；发布构建里不存在：
# scripts/check-no-dev-trust.sh 查 feature 图、产物字符串与「发布进程收到 --dev-trust 拒绝启动」。
dev = ["iwork-ipc/dev"]
# 测试的可观测点（分发入口的屏障与通知），只给测试打开；发布构建没有（T10a 方案 7.2a 表下）
test-hooks = []

[dev-dependencies]
iwork-daemon = { path = ".", features = ["test-hooks"] }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
# 存储的测试钩子（压住写线程、查回执入队的通知），只给测试打开；发布构建没有（T10a 方案 7.2a）
iwork-store = { workspace = true, features = ["test-hooks"] }
tempfile.workspace = true
dunce.workspace = true
rusqlite.workspace = true
libc.workspace = true
pollster.workspace = true
proptest.workspace = true
# 不开 client-core 的 dev：开了会把 dev 带进工作区的 feature 图（check-no-dev-trust.sh 守着）
iwork-client-core.workspace = true

# 真进程测试：测试进程不是受信映像，后台要带 --dev-trust（只在 dev feature 下存在）
[[test]]
name = "process"
path = "tests/process/main.rs"
required-features = ["dev"]

# 生命周期基准（方案第 6 节）：起真的后台，要 dev（后台带 --dev-trust）
[[bench]]
name = "lifecycle"
harness = false
required-features = ["dev"]

# 演练脚本用的生命周期命令工具（只在 dev 下编译）
[[example]]
name = "lifecycle-tool"
required-features = ["dev"]

# 出包前的核对（T04p 方案 4.4）：发布构建里也要编，打包命令用 release 版跑它；不开 dev
[[example]]
name = "check-install"
