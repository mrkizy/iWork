[package]
name = "iwork-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
iwork-domain.workspace = true
iwork-ports.workspace = true
rusqlite.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# 测试用的观测与控制点（压住写线程、查回执入队的通知）。只给测试打开（后台的 dev-dependency），
# 发布构建里没有：见 src/test_hooks.rs
test-hooks = []

[dev-dependencies]
# 测试与基准要真实 codec：快照借事件编码，玩具 codec 得把 11 种实体都编得出来（方案 3.2）
iwork-app.workspace = true
iwork-proto.workspace = true
pollster.workspace = true
proptest.workspace = true
prost.workspace = true
prost-reflect.workspace = true
# progress_handler（hooks 特性）只在测试里用来注入 SQLITE_INTERRUPT
rusqlite = { workspace = true, features = ["hooks"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "write_commit"
harness = false
