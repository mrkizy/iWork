[package]
name = "iwork-client-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
iwork-ipc.workspace = true
iwork-proto.workspace = true
bytes.workspace = true
prost.workspace = true
prost-types.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
ulid = { workspace = true, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
iwork-fake-daemon.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "test-util"] }

[features]
# 只转发到 iwork-ipc/dev（DevTrust）；不是默认 feature。见 scripts/check-no-dev-trust.sh。
dev = ["iwork-ipc/dev"]

# 真进程：要 dev feature 构建的 iwork-daemon（先 cargo build -p iwork-daemon --features dev）
[[test]]
name = "launcher_process"
path = "tests/launcher_process.rs"
required-features = ["dev"]
